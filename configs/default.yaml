# LinkRAG default config. Every stage reads this; override per-experiment by
# copying to configs/<name>.yaml and passing --config.

mode: linkrag            # linkrag | baseline  -- global default, per-stage overridable
device: cpu              # cpu | cuda | mps    -- CPU-first; GPU is optional

models:
  embedding: BAAI/bge-m3         # shared text/figure-caption embedder
  whisper: small                 # faster-whisper size: tiny|base|small|medium|large-v3
  whisper_compute_type: int8     # int8 on CPU, float16 on GPU
  llm:
    # Ollama speaks the OpenAI /v1/chat/completions shape, so both providers use
    # one code path; `provider` only picks a default base_url.
    provider: openai             # ollama | openai | any OpenAI-compatible server
    # Verified against this account's GET /v1/models on 2026-09-06. Dated
    # snapshot, not a floating alias, so pilot numbers stay reproducible.
    # gpt-5.5 was rejected: it only accepts its default temperature (1), and a
    # non-deterministic baseline is not usable as a paper comparison point.
    model: gpt-5.4-2026-03-05
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY  # read from the environment; never commit the key
    temperature: 0.0             # deterministic: this is an eval harness (null = omit)
    seed: 20260910               # best-effort reproducibility; NOT a guarantee
    max_tokens: 1024
    timeout_s: 120
    # Active backend: "default" = the block above (OpenAI, the working backend).
    # Set to a key of llm_backends below, or export LINKRAG_LLM_BACKEND=<key>.
    backend: default

  # Alternative answerer backends, same OpenAI-compatible code path. Selecting one
  # overlays its keys onto models.llm (see core.load_config).
  llm_backends:
    # An open model served from a Colab GPU (Ollama or vLLM) behind a tunnel.
    # THIS is the backend for Phase 8 reported numbers; see scripts/README.md for
    # the setup and the checks to run before trusting a session.
    colab_openai_compatible:
      provider: openai_compatible
      model: qwen2.5:7b-instruct   # Ollama tag, or the HF id vLLM was started with
      base_url: https://REPLACE-ME.trycloudflare.com/v1
      api_key_env: COLAB_LLM_KEY   # vLLM --api-key value; any non-empty string for Ollama
      temperature: 0.0
      seed: 20260910
      max_tokens: 1024
      timeout_s: 300               # cold GPU + long context; the tunnel adds latency

  # USD per 1M tokens, longest model-prefix match (linkrag.costs.price_for).
  # Source: developers.openai.com/api/docs/pricing, read 2026-09-21. A model with
  # no row is reported as "price unknown", never silently as $0.
  pricing:
    gpt-5.4-mini: {input_per_m: 0.75, output_per_m: 4.50}
    gpt-5.4:      {input_per_m: 2.50, output_per_m: 15.00}
    gpt-5-mini:   {input_per_m: 0.25, output_per_m: 2.00}
    gpt-5:        {input_per_m: 1.25, output_per_m: 10.00}
    gpt-4.1-mini: {input_per_m: 0.40, output_per_m: 1.60}
    gpt-4.1:      {input_per_m: 2.00, output_per_m: 8.00}
    qwen2.5:      {input_per_m: 0.0, output_per_m: 0.0}   # self-hosted on Colab: no per-token price
    llama3.1:     {input_per_m: 0.0, output_per_m: 0.0}

ingest:
  chunk_tokens: 300              # text chunk target
  chunk_overlap_tokens: 60
  audio_segment_seconds: 30      # window for audio EvidenceUnits
  # sentence: merge whole whisper segments up to the window (never splits one).
  # fixed: equal-time windows, what the baseline papers do -- cut 70% of
  # boundaries mid-sentence on pilot01. Kept as an ablation axis.
  audio_segmentation: sentence   # sentence | fixed
  min_figure_area_px: 10000      # ignore rules, bullets, logos
  figures_dir: data/processed/figures
  ocr_images: true               # standalone images: pytesseract (needs the tesseract binary)
  # Slide decks caption nothing: 13/18 pilot01 figures had empty content because
  # find_caption looks below the image (a paper convention). OCR the image itself.
  ocr_figures: true
  # A deck is landscape, a paper is portrait. Per-file entries override the
  # heuristic: {my_odd_file.pdf: true}
  slide_deck_landscape_ratio: 0.6
  slide_deck_files: {}
  # Papers draw figures as vector graphics, which page.get_images() cannot see --
  # the Focus paper has 13 captioned figures and yielded 2 raster fragments. When
  # null, this is enabled for non-decks and disabled for decks.
  figures_from_captions: null
  # Deck figures are clustered from vector drawing ops + raster boxes, because a
  # deck draws plots as vectors and page.get_images() sees nothing. New parameters,
  # not retuned thresholds; see src/linkrag/ingest/pdf.py.
  cluster_deck_figures: true
  # Optional VLM figure descriptions via a local Ollama vision model. OFF by
  # default: a 7B VLM on CPU is tens of seconds per image. Results are cached by
  # image content hash, so enabling it costs the full pass exactly once.
  vlm_captions:
    enabled: false
    model: llava:7b            # or qwen2-vl:7b
    base_url: http://localhost:11434
    max_words: 60
    cache_dir: data/processed/vlm_captions
    timeout_s: 300
  # Prime whisper with vocabulary mined from the slide deck. Untuned, whisper
  # transcribed *ingest* as "interest" throughout pilot01 -- the talk's central
  # term, which BM25 then cannot match. Documents are always ingested first.
  asr_vocab_from_slides: true
  # If <stem>.frozen.json exists here, it is used verbatim and whisper never runs.
  # pilot01 is frozen on the guided-v2 transcript; see DESIGN.md measurement rules.
  frozen_transcript_dir: data/processed/transcripts

index:
  backend: numpy                 # exact inner-product search; see Index docstring for the ceiling
  normalize_embeddings: true
  store_dir: data/processed/index

link:
  # --- audio-to-slide alignment (Phase 2, novel component 1) ---
  align:
    method: monotonic          # monotonic | naive ("naive" == P2-style local argmax)
    weights:                   # S = w_dense*cos + w_bm25*BM25norm + w_keyword*IDF-overlap
      dense: 0.6
      bm25: 0.25
      keyword: 0.15
    jump_penalty: 0.05         # lambda: charged per slide when advancing by >1
    skip_penalty: 0.02         # sigma: charged per slide never assigned (incl. head/tail)
    back_penalty: 0.15         # beta: charged per slide when going backwards
    max_back: 2                # B: 0 == strictly monotonic
    start_prior_mu: 0.02       # mu: extra pull of segment 1 toward slide 1;
                               # 0.0 reproduces every pre-existing measurement
    min_score: 0.0             # drop links scoring below this
    links_path: data/processed/links.jsonl

  # --- figure <-> paragraph (Phase 3) ---
  figure_text:
    weights:                   # F = w_r*ref + w_l*layout + w_p*page + w_d*cos + w_o*overlap
      reference: 0.30          # "Figure 3" / "Table 2", or "the diagram below"
      layout: 0.15             # same page, vertical whitespace between bboxes
      page: 0.15
      dense: 0.25
      overlap: 0.15
    page_decay: 2.0            # tau in exp(-|dp|/tau); a prior, never a filter
    layout_max_gap_pt: 220.0   # beyond this vertical gap, layout contributes nothing
    reference_page_window: 1   # "Figure 3" matches only this page or an adjacent one

  # --- figure <-> its own slide's text (Phase 3) ---
  same_slide:
    enabled: true              # ablatable: false emits none
    score: 1.0                 # co-location on a deck page is certain, not scored

  # --- deictic speech <-> visual element (Phase 3) ---
  deictic:
    weights:              # D = w_s*on_slide + w_c*cue + w_d*cos + w_o*keyword_overlap
      slide: 0.45
      cue: 0.15
      dense: 0.20
      overlap: 0.20       # IDF keyword overlap vs figure OCR/caption -- the
                          # tie-break when a slide carries several figures
    # Object deixis is generated as determiner x noun x direction rather than
    # listed by hand, so coverage stays uniform ("this arrow here", "the box
    # on the right", "that step below").
    object_nouns: [arrow, box, step, line, circle, node, column, row, bar, point,
                   block, region, curve, axis]
    directions: [above, below, "on the left", "on the right", here, there]
    determiners: [the, this, that]
    # Cue tiers: 1 = explicit object deixis ("this arrow here"), 2 = bare pronoun
    # with a visual word in the same sentence, 3 = bare pronoun alone. The weight
    # multiplies `weights.cue`, so tier changes ranking without moving thresholds.
    tier_weights: {1: 1.0, 2: 0.6, 3: 0.3}
    visual_terms: [see, seen, show, shows, showing, shown, look, looking, plot,
                   plotted, screen, slide, figure, graph, diagram, arrow, chart,
                   picture, image, axis, curve, table, box, column, row, highlight,
                   highlighted, display, displayed, draw, drawn, point, pointing]

  # Thresholds are per link_type; tune on the dev set, don't hardcode one global.
  figure_text_threshold: 0.50
  deictic_threshold: 0.45
  deictic_cues: ["here", "this", "that", "that one", "this one", "shown",
                 "on the left", "on the right", "this slide", "as you can see",
                 "as you see", "look at this", "over here", "right here"]
  max_links_per_unit: 8

retrieve:
  top_k: 8                       # units handed to the LLM
  candidates: 50                 # pulled from each ranker before fusion
  rrf_k: 60                      # reciprocal rank fusion constant (Cormack 2009)
  # Design change 2026-09-21 (verified-gold result, reports/regression.md):
  #   additive -- retrieve k_final seeds, ADD their 1-hop link neighbours to the
  #               candidate pool, and let the selection step (reranker, or score when
  #               rerank=none) pick k_final. Expansion never evicts a seed on its own.
  #   evict    -- the Phase-4 behaviour: k_seed (< k_final) seeds, expansions fill the
  #               remaining slots unconditionally. Evicted gold ranked 6-8 on the
  #               verified set (A1 100% -> 0%). Kept only as the recorded ablation.
  expansion: additive            # additive | evict

  # --- link-following retrieval (Phase 4, novel component 2) ---
  linkrag:
    k_seed: 5                    # seeds from the hybrid retriever
    k_final: 8                   # units handed to the generator
    hops: 1
    link_types: [audio_slide, figure_text, deictic]
    min_link_score: 0.0
    decay: 0.5                   # expanded score = seed_score * link_score * decay
    # Rank-normalise seed scores to (0,1]. Raw RRF is ~0.03 against link weights of
    # ~0.6-1.0, so seed x link x decay is two orders below any seed. Under additive
    # expansion "select by score" is meaningless without this, so it is on as part
    # of the same design change; false reproduces every number recorded before
    # 2026-09-07 (with expansion: evict).
    normalise_seeds: true

  # --- complementarity-aware reranking (Phase 5, novel component 3) ---
  rerank:
    method: complementarity      # none (plain top-k) | mmr | complementarity
    alpha: 0.3                   # bonus per newly represented modality
    beta: 0.2                    # bonus per link edge into the selected set
    gamma: 0.4                   # penalty on same-modality cosine redundancy
    mmr_lambda: 0.5              # only used by method: mmr
    cross_encoder: null          # e.g. BAAI/bge-reranker-base; null = retrieval scores
    pool: 20                     # candidates retrieved before reranking down to k

  # --- iterative re-querying, our P1 (MI-RAG) approximation ---
  iterative:
    rounds: 2                    # total retrievals, including the first
    k_per_round: 8

dataset:
  # Extended-dataset intake (scripts/dataset/candidate.py). A candidate lecture is
  # kept only if the speaker does NOT simply narrate the deck. pilot01 measured
  # deck->transcript 0.942; the bar is well below it.
  intake:
    max_deck_to_transcript: 0.65
    redundancy_k: 8
    redundancy_runs: 3

eval:
  metrics: [answer_accuracy, evidence_precision, evidence_recall, cross_modal_coverage, citation_faithfulness]
  report_both_modes: true
  # Judge for gold verification, answer grading and the redundancy metric. Must be a
  # DIFFERENT model from models.llm (the answerer): self-grading is lenient. Preferred
  # default is a local model (e.g. provider: ollama, model: llama3.1:8b, with
  # models.llm on qwen2.5:7b); this machine (8 GB, no Ollama runtime) cannot host one,
  # so the judge is a different hosted family instead. Same OpenAI-compatible shape.
  judge:
    provider: openai
    model: gpt-4.1-mini-2025-04-14   # gpt-4.1 has a 30k TPM cap on this account
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    temperature: 0.0
    seed: 20260921
    max_tokens: 1024
    timeout_s: 120
